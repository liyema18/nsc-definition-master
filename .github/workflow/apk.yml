name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/liyema/nscmaster
          echo "plugins { id 'com.android.application' }
          android { namespace 'com.liyema.nscmaster'; compileSdk 34; defaultConfig { applicationId 'com.liyema.nscmaster'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } buildTypes { release { minifyEnabled false } } }
          " > app/build.gradle

          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="NSC Master"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          echo 'package com.liyema.nscmaster; import android.app.Activity; import android.os.Bundle; import android.webkit.*; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.setWebViewClient(new WebViewClient()); w.loadUrl("https://liyema18.github.io/nsc-definition-master/"); setContentView(w); } }' > app/src/main/java/com/liyema/nscmaster/MainActivity.java

          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.4' apply false }" > build.gradle
          gradle wrapper
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSC-Master-APK
          path: app/build/outputs/apk/debug/app-debug.apk
