name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK from website
        uses: sadhakbj/website-2-apk-action@v1
        with:
          website-url: https://liyema18.github.io/nsc-definition-master/
          app-name: NSC Definition Master
          package-name: com.liyema.nscmaster
          app-icon: https://cdn-icons-png.flaticon.com/512/2232/2232688.png

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSC-Master-APK
          path: app/build/outputs/apk/release/app-release.apk
